<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Civility AI</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-logo">
            <img src="images/logo.png" alt="Logo">
        </div>

        <div class="menu">

            <div class="menu-item active" data-option="score">
                <img src="images/score.png" class="menu-icon">
                <span>Check Civility Score</span>
            </div>

            <div class="menu-item" data-option="text">
                <img src="images/text.png" class="menu-icon">
                <span>Text Refinement</span>
            </div>

            <div class="menu-item" data-option="image">
                <img src="images/image.png" class="menu-icon">
                <span>Image Refinement</span>
            </div>

            <div class="menu-item" data-option="video">
                <img src="images/video.png" class="menu-icon">
                <span>Video Refinement</span>
            </div>

        </div>
    </div>

    <!-- CENTER AREA -->
    <div class="center-area">

        <h1 class="title">Civility AI</h1>

        <div class="input-wrapper">

            <div id="userInput" class="editable" contenteditable="true" data-placeholder="Enter text"></div>

            <!-- Upload icon (will be hidden when needed) -->
            <label class="upload-icon" id="uploadIcon">
                <img src="images/upload.png" alt="Upload">
            </label>

            <input type="file" id="fileUpload" />

        </div>

        <div class="button-group">
            <button id="checkBtn">Check Civility</button>
            <button id="refineBtn">Refine and Download</button>
        </div>

        <div id="output"></div>

    </div>

    <!-- Loader (USED BY YOUR JS) -->
    <div id="loader" class="loader">
        <div class="spinner"></div>
    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
